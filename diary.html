<main class="main">



<div class="page-title">

📖 今日投资日记

</div>


<div class="subtitle">

记录想法，而不是记录价格

</div>





<div class="notion-box">


<h2 class="notion-title">

今天的市场

</h2>




<div>


<span class="tag active">
上涨
</span>


<span class="tag">
震荡
</span>


<span class="tag">
下跌
</span>


</div>






<h3>

今日情绪

</h3>


<div class="emoji">

😊 😐 😰 🔥

</div>




</div>







<div class="notion-box">


<h2 class="notion-title">

投资观察

</h2>



<textarea
id="diaryContent"
placeholder="
今天市场发生了什么？

你的判断是什么？
">

</textarea>



</div>







<div class="notion-box">


<h2 class="notion-title">

交易记录

</h2>


<input
id="diaryTitle"
placeholder="
例如：买入腾讯">




<textarea
placeholder="
为什么买？

计划是什么？
">

</textarea>



</div>








<div class="notion-box">


<h2 class="notion-title">

错误反思

</h2>



<textarea
placeholder="
今天哪里做得不好？
">

</textarea>



</div>








<button onclick="addDiary()">

保存今日复盘

</button>








<div class="notion-box">


<h2 class="notion-title">

历史记录

</h2>


<div id="diaries">

</div>


</div>






</main>


</div>
