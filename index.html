<body>



<header>

<h1>
📈 投资日记 Pro
</h1>


<p>
记录 · 分析 · 复盘 · 成长
</p>


</header>





<div class="container">





<!-- 数据仪表盘 -->

<div class="card">

<h2>
📊 投资概览
</h2>


<div id="dashboard">

</div>


</div>






<!-- 收益曲线 -->

<div class="card">


<h2>
📈 收益趋势
</h2>


<canvas id="profitChart">

</canvas>


</div>






<!-- K线 -->

<div class="card">


<h2>
📊 模拟K线
</h2>


<canvas id="kChart">

</canvas>


</div>







<!-- 添加投资 -->


<div class="card">


<h2>
➕ 新增投资记录
</h2>



<input 
id="stock"
placeholder="股票名称">



<input 
id="buyPrice"
placeholder="买入价格">



<input 
id="currentPrice"
placeholder="当前价格">



<input 
id="quantity"
placeholder="买入数量">



<button onclick="addInvestment()">

保存投资

</button>



</div>








<!-- 持仓记录 -->


<div class="card">


<h2>
📂 我的持仓
</h2>



<div id="records">

</div>


</div>

<div class="nav">

</a>

</a>



</div>





</div>
