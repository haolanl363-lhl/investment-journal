<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>投资日记</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Microsoft YaHei",
    sans-serif;

    background:#f5f5f5;
    color:#222;
}


/* 主内容 */

.main{

    padding:25px;

}


.logo{

    font-size:26px;
    font-weight:bold;
    margin-bottom:30px;

}


/* 左侧菜单 */

.drawer{

    position:fixed;

    left:-260px;

    top:0;

    width:260px;

    height:100vh;

    background:white;

    box-shadow:
    3px 0 15px rgba(0,0,0,.15);


    transition:.3s;

    z-index:1000;

    padding:30px 20px;

}


.drawer.show{

    left:0;

}



.menu-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:35px;

}


.menu-item{

    padding:18px 5px;

    font-size:17px;

}



.mask{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.3);

    display:none;

    z-index:999;

}


.mask.show{

    display:block;

}



/* 内容卡片 */


.card{

background:white;

border-radius:20px;

padding:25px;

margin-top:20px;


}


h1{

font-size:28px;

}


h2{

font-size:22px;

}



</style>


</head>



<body>



<div class="drawer" id="drawer">


<div class="menu-title">
📈 投资日记
</div>


<div class="menu-item">
🏠 首页
</div>


<div class="menu-item">
📊 投资分析
</div>


<div class="menu-item">
📖 投资日记
</div>


<div class="menu-item">
❌ 错题本
</div>


<div class="menu-item">
🧠 AI复盘
</div>



</div>



<div class="mask" id="mask"></div>



<div class="main">


<div class="logo">

📈 投资日记

</div>



<div class="card">


<h1>
📖 今日投资日记
</h1>


<p>
记录想法，而不是记录价格
</p>


</div>



<div class="card">


<h2>
今天的市场
</h2>


<button>
上涨
</button>


<button>
震荡
</button>


<button>
下跌
</button>


</div>



</div>



<script>


let drawer=
document.getElementById("drawer");


let mask=
document.getElementById("mask");



function openMenu(){

drawer.classList.add("show");

mask.classList.add("show");

}



function closeMenu(){

drawer.classList.remove("show");

mask.classList.remove("show");

}




mask.onclick=closeMenu;



let startX=0;


document.addEventListener(
"touchstart",
e=>{

startX=e.touches[0].clientX;

}

);



document.addEventListener(
"touchend",
e=>{


let endX=e.changedTouches[0].clientX;


if(startX<40 && endX-startX>80){

openMenu();

}


if(startX>260 && startX-endX>80){

closeMenu();

}



}

);



</script>


</body>
</html>
